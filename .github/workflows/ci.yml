name: Offline checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python -O -m unittest discover -s tests -v
      - run: python tools/build_release.py
      - if: runner.os == 'Windows'
        shell: powershell
        run: |
          $parseErrors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD 'Install.ps1'), [ref]$null, [ref]$parseErrors)
          if ($parseErrors.Count -gt 0) { throw ($parseErrors | Out-String) }
          python -m pip install --dry-run --ignore-installed --only-binary=:all: --require-hashes -r requirements.txt
          if ($LASTEXITCODE -ne 0) { throw 'Pinned dependency resolution failed' }
