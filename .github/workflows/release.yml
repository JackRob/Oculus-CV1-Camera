name: Build draft release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (v0.1.0 for this package)
        required: true
        default: v0.1.0
permissions:
  contents: write
jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - run: python -m unittest discover -s tests -v
      - run: python -O -m unittest discover -s tests -v
      - run: python tools/build_release.py
      - name: Create draft for manual review
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          test "$RELEASE_TAG" = 'v0.1.0'
          gh release create "$RELEASE_TAG" dist/*.zip dist/SHA256SUMS.txt --draft --target "$GITHUB_SHA" --title '0.1.0 - Experimental CV1 native IR webcam' --notes-file docs/RELEASE_NOTES.md
